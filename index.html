<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Standby Timer</title>
<style>
  body, html {
    margin:0; padding:0;
    width:100%; height:100%;
    background: url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: sans-serif;
    overflow: hidden;
  }

  /* ===== 時計＆タイマーラッパー ===== */
  .wrapper {
    position: absolute;
    right: 50px;      /* 右寄せ調整 */
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    z-index: 1;
  }

  /* ===== 時計 ===== */
  .clock {
    position: relative;
    width: 160px;     /* 少し小さめ */
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(rgba(40,40,40,0.7), rgba(0,0,0,0.85));
    backdrop-filter: blur(6px);
    margin-left: auto;
    margin-right: 0;
  }

  .number {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 18px;  /* 時計のリングに合わせて調整 */
    color: white;
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    transform: translateX(-50%);
    border-radius: 4px;
  }

  .hour { width: 4px; height: 45px; background: white; }
  .minute { width: 3px; height: 60px; background: white; }
  .second { width: 2px; height: 70px; background: red; }

  .center {
    position: absolute;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* ===== タイマー ===== */
  .timer {
    margin-top: 10px;
    width: 160px;
    display: flex;
    justify-content: center;
  }

  .timer-ring {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 10px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
  }

  /* ===== ハンバーガー ===== */
  .menu-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 26px;
    cursor: pointer;
    z-index: 10;
    opacity: 1;
    transition: opacity 1s;
  }

  .menu-btn.hide { opacity:0; pointer-events:none; }

  .menu {
    position: absolute;
    top: 60px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    border-radius: 12px;
    padding: 10px;
    display: none;
    z-index: 10;
    backdrop-filter: blur(8px);
  }

  .menu button, .menu input {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="clock" id="clock">
    <div class="center"></div>
  </div>
  <div class="timer">
    <div class="timer-ring" id="timerDisplay">00:00</div>
  </div>
</div>

<div class="menu-btn" id="menuBtn">&#9776;</div>
<div class="menu" id="menu">
  <input type="number" id="timerInput" placeholder="時間を設定してください">
  <button id="setTimerBtn">決定</button>
  <button id="startBtn">開始</button>
  <button id="stopBtn">停止</button>
  <button id="resetBtn">リセット</button>
  <button id="changeImageBtn">画像変更</button>
</div>

<script>
  // ===== 時計 =====
  const clock = document.getElementById('clock');
  function updateClock() {
    const now = new Date();
    const hour = now.getHours()%12;
    const minute = now.getMinutes();
    const second = now.getSeconds();

    // 時計の針作成
    clock.innerHTML = '<div class="center"></div>' +
      '<div class="hand hour" style="transform: translateX(-50%) rotate(' + (hour*30 + minute/2) + 'deg)"></div>' +
      '<div class="hand minute" style="transform: translateX(-50%) rotate(' + (minute*6) + 'deg)"></div>' +
      '<div class="hand second" style="transform: translateX(-50%) rotate(' + (second*6) + 'deg)"></div>';

    // 数字
    for(let i=1;i<=12;i++){
      const num = document.createElement('div');
      num.className = 'number';
      const angle = (i*30 - 90)*Math.PI/180;
      const radius = 70;
      num.style.left = 80 + radius*Math.cos(angle) + 'px';
      num.style.top = 80 + radius*Math.sin(angle) + 'px';
      num.textContent = i;
      clock.appendChild(num);
    }
  }
  setInterval(updateClock,1000);
  updateClock();

  // ===== タイマー =====
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerInput = document.getElementById('timerInput');
  const setTimerBtn = document.getElementById('setTimerBtn');
  const changeImageBtn = document.getElementById('changeImageBtn');

  let timer = 0;
  let interval = null;

  function updateTimerDisplay() {
    const minutes = Math.floor(timer/60).toString().padStart(2,'0');
    const seconds = (timer%60).toString().padStart(2,'0');
    timerDisplay.textContent = `${minutes}:${seconds}`;
  }

  setTimerBtn.addEventListener('click', () => {
    const inputMinutes = parseInt(timerInput.value);
    if(!isNaN(inputMinutes) && inputMinutes > 0){
        timer = inputMinutes * 60;
        updateTimerDisplay();
    }
  });

  startBtn.addEventListener('click', () => {
    if(interval || timer <=0) return;
    interval = setInterval(() => {
      if(timer>0){
        timer--;
        updateTimerDisplay();
      } else {
        clearInterval(interval);
        interval = null;
      }
    },1000);
    startBtn.style.background = 'red';
  });

  stopBtn.addEventListener('click', () => {
    clearInterval(interval);
    interval = null;
    startBtn.style.background = '';
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(interval);
    interval = null;
    timer = 0;
    updateTimerDisplay();
    startBtn.style.background = '';
  });

  // ===== ハンバーガーメニュー =====
  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  menuBtn.addEventListener('click', ()=>{
    if(menu.style.display==='block') menu.style.display='none';
    else menu.style.display='block';
    setTimeout(()=>{ menu.style.display='none'; }, 5000);
  });
</script>
</body>
</html>
